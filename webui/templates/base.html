<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GameBrains</title>
<style>
  :root {
    /* Console for observing minds: deep-console page, screen-module cards, amber signal accent,
       five agent-kind signature colors rendered as glowing indicator lights (see .creature .glyph
       and the active-nav rules below for where the glow is actually spent -- deliberately not
       everywhere, see the design rationale in CLAUDE.md). */
    --felt: #0e1220; --felt-deep: #070911; --felt-text: #c7cbe6;
    --panel: #1a1f33; --panel-edge: #3a3f5c; --ink: #eef0f7; --ink-soft: #9aa0c4;
    --gold: #f0a83d; --gold-deep: #c9822a;
    --piece-qlearning: #5a94c2; --piece-dqn: #a06bc2; --piece-fep: #8fb75a;
    --piece-markov_brain: #e07b3d; --piece-classic: #8f8878;
    --coop: #5cc26e; --defect: #e2554a;
    --font-display: "Cascadia Code", Consolas, "SF Mono", Menlo, monospace;
    --font-body: "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif;
    --font-mono: "Cascadia Code", Consolas, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--felt);
    background-image: radial-gradient(circle at 15% -10%, #2d3a6640 0%, transparent 55%);
    color: var(--felt-text); font-family: var(--font-body); line-height: 1.45;
  }
  header.top {
    background: var(--felt-deep); border-bottom: 3px solid var(--gold);
    padding: 18px 28px 0; display: flex; align-items: flex-end; gap: 18px; flex-wrap: wrap;
  }
  header.top .brand { display: flex; align-items: center; gap: 10px; padding-bottom: 14px; }
  header.top h1 {
    font-family: var(--font-display); font-size: 26px; margin: 0; color: var(--gold);
    letter-spacing: .04em; font-weight: 700; text-shadow: 0 0 14px #f0a83d55;
  }
  header.top .tag {
    color: var(--felt-text); opacity: .65; font-size: 12px; padding-bottom: 16px;
    text-transform: uppercase; letter-spacing: .08em;
  }
  nav.tabs { margin-left: auto; display: flex; gap: 4px; }
  nav.tabs a {
    color: var(--felt-text); text-decoration: none; padding: 9px 18px; font-size: 13.5px;
    font-family: var(--font-display); border-radius: 8px 8px 0 0; background: #ffffff12;
    border: 1px solid #ffffff22; border-bottom: none; opacity: .75;
  }
  nav.tabs a:hover { opacity: 1; }
  nav.tabs a.active {
    background: var(--panel); color: var(--gold); opacity: 1; font-weight: 600;
    box-shadow: 0 0 12px #f0a83d40;
  }
  nav.subtabs { display: flex; gap: 6px; margin: 14px 0; flex-wrap: wrap; }
  .subtab-btn {
    padding: 8px 16px; border-radius: 8px; border: 1px solid var(--panel-edge);
    background: #ffffff0c; color: var(--felt-text); font-family: var(--font-display);
    font-size: 13px; cursor: pointer; opacity: .8;
  }
  .subtab-btn:hover { opacity: 1; }
  .subtab-btn.active {
    background: var(--panel); color: var(--gold); opacity: 1; font-weight: 600;
    box-shadow: 0 0 10px #f0a83d33;
  }
  main { max-width: 1080px; margin: 0 auto; padding: 26px 24px 70px; }
  .panel {
    background: var(--panel); color: var(--ink); border-radius: 10px;
    padding: 20px 24px; margin-bottom: 22px; box-shadow: 0 6px 20px #00000060;
    border: 1px solid var(--panel-edge); border-top: 2px solid var(--gold);
  }
  .panel h2 {
    margin: 0 0 14px; font-family: var(--font-display); font-size: 15px; font-weight: 700;
    color: var(--ink); display: flex; align-items: center; gap: 10px; letter-spacing: .03em;
  }
  .panel h2 .step {
    display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px;
    border-radius: 50%; background: var(--gold); color: var(--felt-deep); font-size: 12px;
    font-family: var(--font-body); font-weight: 700;
  }
  .glyph { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.5;
    vertical-align: middle; flex-shrink: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
  label { display: block; font-size: 12.5px; color: var(--ink-soft); margin: 10px 0 4px; }
  label .hint { font-style: italic; }
  input[type=number], input[type=text], select {
    width: 100%; padding: 7px 9px; border-radius: 6px; border: 1px solid var(--panel-edge);
    background: var(--felt-deep); color: var(--ink); font-size: 14px; font-family: var(--font-body);
  }
  input[type=number]:focus, input[type=text]:focus, select:focus {
    outline: none; border-color: var(--gold); box-shadow: 0 0 0 2px #f0a83d33;
  }
  select:disabled, option:disabled { color: #5a5f7a; }
  fieldset { border: 1px solid var(--panel-edge); border-radius: 8px; padding: 12px 14px; margin-top: 14px; }
  legend { color: var(--ink-soft); font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; padding: 0 6px; }
  .checkrow { display: flex; align-items: center; gap: 8px; margin: 9px 0; }
  .checkrow input { width: auto; }
  .checkrow.disabled { opacity: .5; }
  button, .btn {
    background: var(--gold); color: var(--felt-deep); border: none; border-radius: 8px;
    padding: 11px 22px; font-size: 15px; font-weight: 700; font-family: var(--font-display);
    cursor: pointer; margin-top: 8px; letter-spacing: .02em;
  }
  button:hover, .btn:hover { background: #ffbc5c; box-shadow: 0 0 16px #f0a83d55; }
  button:focus-visible, .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  button.secondary, .btn.secondary {
    background: #262c47; color: var(--ink); border: 1px solid var(--panel-edge);
    font-weight: 600; font-size: 13px; padding: 7px 14px; font-family: var(--font-body);
  }
  button.secondary:hover, .btn.secondary:hover { background: #303756; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; font-family: var(--font-mono); }
  th, td { padding: 5px 9px; text-align: center; border: 1px solid var(--panel-edge); }
  th { color: var(--ink-soft); font-weight: 600; font-family: var(--font-body); }
  .qtable td.pick { color: var(--coop); font-weight: 700; text-align: left; border: none; font-family: var(--font-body); }
  .creature {
    border: 1px solid var(--panel-edge); border-radius: 8px; padding: 16px 18px; margin-bottom: 14px;
    background: #232941; border-left: 4px solid var(--piece-color, var(--gold));
    box-shadow: -6px 0 18px -10px var(--piece-color, transparent);
  }
  .creature h3 {
    margin: 0 0 10px; font-size: 15px; font-family: var(--font-display); font-weight: 700;
    display: flex; align-items: center; gap: 8px; color: var(--ink);
  }
  .creature .glyph {
    color: var(--piece-color, var(--ink)); width: 26px; height: 26px;
    filter: drop-shadow(0 0 5px var(--piece-color, transparent));
  }
  .creature .kindtag {
    display: inline-block; font-size: 10.5px; padding: 2px 8px; border-radius: 3px;
    background: var(--piece-color, var(--ink-soft)); color: #fff; text-transform: uppercase;
    letter-spacing: .03em; font-family: var(--font-body);
  }
  .meta { color: var(--ink-soft); font-size: 12px; margin: 6px 0 0; }
  .rule { font-size: 14px; }
  .beliefs .barrow { display: flex; align-items: center; gap: 8px; margin: 4px 0; font-size: 12px; }
  .beliefs .lab { width: 90px; color: var(--ink-soft); text-align: right; font-family: var(--font-mono); }
  .beliefs .bar { flex: 1; background: #2a3050; border-radius: 3px; height: 12px; overflow: hidden; }
  .beliefs .fill {
    display: block; height: 100%; background: var(--piece-fep);
    box-shadow: 0 0 8px var(--piece-fep);
  }
  .beliefs .val { width: 36px; color: var(--ink-soft); font-family: var(--font-mono); }
  .mbrain .bit {
    display: inline-flex; width: 24px; height: 24px; align-items: center; justify-content: center;
    margin: 0 3px 3px 0; border-radius: 4px; font-size: 12px; font-weight: 700; font-family: var(--font-mono);
  }
  .mbrain .bit.sensor { border: 2px solid var(--piece-qlearning); }
  .mbrain .bit.hidden { border: 2px solid var(--ink-soft); }
  .mbrain .bit.motor { border: 2px solid var(--piece-markov_brain); }
  .mbrain .bit.on {
    background: var(--piece-markov_brain); color: #fff; box-shadow: 0 0 8px var(--piece-markov_brain);
  }
  .mbrain .bit.off { background: #2a3050; color: var(--ink-soft); }
  .legend { font-style: italic; }
  .dqnnet { margin: 8px 0; }
  .netlayer { display: flex; align-items: center; gap: 4px; margin: 4px 0; flex-wrap: wrap; }
  .netlabel { width: 150px; color: var(--ink-soft); font-size: 11.5px; flex-shrink: 0; font-family: var(--font-body); }
  .neuron { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 1px solid #ffffff30; }
  .moretag { color: var(--ink-soft); font-size: 11px; margin-left: 4px; }
  details.explain {
    margin-top: 10px; background: #20263f; border: 1px solid var(--panel-edge); border-radius: 6px;
    padding: 8px 12px; font-size: 13px;
  }
  details.explain summary { cursor: pointer; color: var(--gold); font-weight: 600; font-size: 12.5px; }
  details.explain p { margin: 8px 0 0; }
  pre.console {
    background: var(--felt-deep); color: var(--felt-text); border-radius: 8px; padding: 12px 14px;
    max-height: 420px; overflow: auto; font-size: 12px; white-space: pre-wrap; font-family: var(--font-mono);
  }
  .coopchart { width: 100%; height: 140px; background: var(--felt-deep); border-radius: 8px; }
  .scatterchart { width: 100%; height: 360px; background: var(--felt-deep); border-radius: 8px; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 4px; font-size: 11.5px; font-weight: 600; }
  .badge.ok { background: var(--coop); color: #0e1220; }
  .badge.warn { background: var(--defect); color: #0e1220; }
  .badge.todo { background: #262c47; color: var(--ink-soft); border: 1px dashed var(--panel-edge); }
  code { background: #262c47; color: var(--ink); padding: 1px 5px; border-radius: 3px; font-size: 12px; font-family: var(--font-mono); }
  a { color: var(--gold); }
  a:hover { color: #ffbc5c; }
  .backlink { display: inline-block; margin-bottom: 16px; color: var(--felt-text); }
  .rosterrow {
    display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; padding: 12px;
    border: 1px solid var(--panel-edge); border-radius: 8px; margin-bottom: 8px; background: #171c30;
  }
  .rosterrow .kindpick { min-width: 190px; display: flex; align-items: flex-end; gap: 8px; }
  .rosterrow .kindpick .glyph { color: var(--ink-soft); margin-bottom: 8px; }
  .rosterrow .kindpick select { flex: 1; }
  .rosterrow .countpick { width: 80px; }
  .rosterrow .kindfield { min-width: 140px; }
  .rosterrow .removerow { align-self: center; }
  .rosterrow details.advanced { flex-basis: 100%; margin-top: 4px; }
  .rosterrow details.advanced .grid { margin-top: 8px; }
  .epsilon-hint { font-size: 11px; color: var(--ink-soft); display: block; margin-top: 2px; }
  #agent-total { color: var(--gold-deep); font-weight: 700; }
  .quickadd { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
  .quickstart-modal {
    position: fixed; right: 20px; bottom: 20px; max-width: 300px; z-index: 50;
    background: var(--panel); color: var(--ink); border-radius: 10px; padding: 16px 18px;
    box-shadow: 0 8px 24px #00000060; border-top: 4px solid var(--gold);
  }
  .quickstart-modal p { margin: 4px 0 12px; font-size: 13px; }
  .quickstart-modal .wizard-title { font-weight: 700; margin-bottom: 8px; }
  .quickstart-modal .wizard-choice {
    display: block; font-size: 13px; margin: 6px 0; cursor: pointer; font-weight: 400;
  }
  .quickstart-modal .wizard-choice input { margin-right: 6px; }
  .quickstart-modal .quickstart-close {
    position: absolute; top: 6px; right: 10px; background: none; border: none; box-shadow: none;
    font-size: 18px; line-height: 1; color: var(--ink-soft); padding: 0; margin: 0; cursor: pointer;
  }
  .quickstart-modal .btn { width: 100%; margin-top: 8px; }
  .quickstart-modal .secondary { width: 48%; margin-top: 8px; }
  .quickstart-pill { display: none; }
  .quickstart-modal.minimized {
    padding: 0; border-radius: 999px; max-width: none; width: auto; border-top: none;
    box-shadow: 0 4px 14px #00000050;
  }
  .quickstart-modal.minimized .wizard-step, .quickstart-modal.minimized .quickstart-close {
    display: none !important;
  }
  .quickstart-modal.minimized .quickstart-pill {
    display: flex; align-items: center; gap: 6px; padding: 10px 16px; border-radius: 999px;
    background: var(--panel); color: var(--ink); border: 2px solid var(--gold); box-shadow: none;
    font-weight: 700; margin: 0; width: auto;
  }
  .quickstart-modal.minimized .quickstart-pill .glyph { width: 16px; height: 16px; }
  .spacecell { text-align: center; font-variant-numeric: tabular-nums; }
  .spacecell.full { background: rgba(34, 160, 80, 0.35); }
  .spacecell.partial { background: rgba(217, 164, 65, 0.35); }
  .spacecell.empty { background: rgba(128, 128, 128, 0.18); color: var(--ink-soft); }
  .spacecell.invalid { color: var(--ink-soft); opacity: 0.5; }
  .fw-tabs {
    display: flex; gap: 4px; margin: 0 0 16px; flex-wrap: wrap; position: sticky; top: 0;
    z-index: 20; background: var(--felt); padding: 8px 0;
  }
  .fw-tab {
    flex: 1; min-width: 90px; display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 8px 4px; border-radius: 8px; border: 2px solid var(--panel-edge);
    background: var(--panel); color: var(--ink-soft); cursor: pointer; font-size: 12px;
    box-shadow: none; margin: 0;
  }
  .fw-tab .glyph { width: 20px; height: 20px; }
  .fw-tab .fw-num {
    display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px;
    border-radius: 50%; background: var(--panel-edge); font-size: 11px; font-weight: 700;
  }
  .fw-tab.active {
    border-color: var(--gold); color: var(--ink); background: #f0a83d1e;
    box-shadow: 0 0 14px #f0a83d40;
  }
  .fw-tab.active .fw-num { background: var(--gold); color: #0e1220; }
  .fw-tab.done { color: var(--ink); }
  .fw-tab.done .fw-num { background: var(--coop); color: #0e1220; }
  .fw-nav { display: flex; justify-content: space-between; gap: 8px; margin-top: 14px; }
  .fw-nav .btn, .fw-nav .secondary { width: auto; min-width: 140px; margin: 0; }
  .fieldicon { display: inline-flex; align-items: center; gap: 5px; }
  .fieldicon .glyph { width: 15px; height: 15px; color: var(--ink-soft); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="glyph-qlearning" viewBox="0 0 24 24">
      <rect x="3" y="3" width="18" height="18" rx="1.5"/>
      <line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/>
      <line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/>
    </symbol>
    <symbol id="glyph-dqn" viewBox="0 0 24 24">
      <circle cx="5" cy="6" r="2"/><circle cx="5" cy="12" r="2"/><circle cx="5" cy="18" r="2"/>
      <circle cx="19" cy="12" r="2"/>
      <line x1="7" y1="6" x2="17" y2="11.3"/><line x1="7" y1="12" x2="17" y2="12"/>
      <line x1="7" y1="18" x2="17" y2="12.7"/>
    </symbol>
    <symbol id="glyph-fep" viewBox="0 0 24 24">
      <path d="M2 12 C6 5, 18 5, 22 12 C18 19, 6 19, 2 12 Z"/><circle cx="12" cy="12" r="3.2"/>
    </symbol>
    <symbol id="glyph-markov_brain" viewBox="0 0 24 24">
      <path d="M12 2 L20 7 V17 L12 22 L4 17 V7 Z"/>
      <circle cx="12" cy="12" r="2"/><circle cx="12" cy="6" r="1.3"/><circle cx="17.5" cy="9.5" r="1.3"/>
      <circle cx="17.5" cy="14.5" r="1.3"/><circle cx="12" cy="18" r="1.3"/><circle cx="6.5" cy="14.5" r="1.3"/>
      <circle cx="6.5" cy="9.5" r="1.3"/>
    </symbol>
    <symbol id="glyph-classic" viewBox="0 0 24 24">
      <rect x="4" y="3" width="16" height="18" rx="1"/>
      <line x1="7" y1="8" x2="17" y2="8"/><line x1="7" y1="12" x2="17" y2="12"/><line x1="7" y1="16" x2="14" y2="16"/>
    </symbol>

    <!-- section-header glyphs (not tied to a specific agent kind) -->
    <symbol id="glyph-game" viewBox="0 0 24 24">
      <rect x="4" y="4" width="16" height="16" rx="3"/>
      <circle cx="8.5" cy="8.5" r="1.2"/><circle cx="15.5" cy="8.5" r="1.2"/>
      <circle cx="12" cy="12" r="1.2"/>
      <circle cx="8.5" cy="15.5" r="1.2"/><circle cx="15.5" cy="15.5" r="1.2"/>
    </symbol>
    <symbol id="glyph-roster" viewBox="0 0 24 24">
      <line x1="2" y1="19" x2="22" y2="19"/>
      <circle cx="5" cy="14" r="2.4"/><circle cx="12" cy="9" r="2.4"/><circle cx="19" cy="14" r="2.4"/>
    </symbol>
    <symbol id="glyph-metrics" viewBox="0 0 24 24">
      <line x1="3" y1="21" x2="21" y2="21"/>
      <rect x="5" y="14" width="3.4" height="7"/><rect x="10.3" y="9" width="3.4" height="12"/>
      <rect x="15.6" y="4" width="3.4" height="17"/>
    </symbol>
    <symbol id="glyph-ledger" viewBox="0 0 24 24">
      <ellipse cx="9" cy="12" rx="5.2" ry="3.2" transform="rotate(-30 9 12)"/>
      <ellipse cx="15" cy="12" rx="5.2" ry="3.2" transform="rotate(-30 15 12)"/>
    </symbol>
    <symbol id="glyph-filter" viewBox="0 0 24 24">
      <circle cx="10" cy="10" r="6.2"/>
      <line x1="14.6" y1="14.6" x2="21" y2="21"/>
    </symbol>
    <symbol id="glyph-scale" viewBox="0 0 24 24">
      <line x1="12" y1="3" x2="12" y2="19"/><line x1="4" y1="7" x2="20" y2="7"/>
      <path d="M4 7 L1.5 13 A3 3 0 0 0 6.5 13 Z"/>
      <path d="M20 7 L17.5 13 A3 3 0 0 0 22.5 13 Z"/>
      <line x1="8" y1="21" x2="16" y2="21"/>
    </symbol>
    <symbol id="glyph-evolve" viewBox="0 0 24 24">
      <path d="M5 12a7 7 0 0 1 12.5-4.2"/><path d="M19 12a7 7 0 0 1-12.5 4.2"/>
      <polygon points="17,4 18.5,7.5 15,7"/><polygon points="7,20 5.5,16.5 9,17"/>
    </symbol>
    <symbol id="glyph-versus" viewBox="0 0 24 24">
      <polyline points="4,6 10,12 4,18"/><polyline points="20,6 14,12 20,18"/>
    </symbol>
    <symbol id="glyph-log" viewBox="0 0 24 24">
      <rect x="3" y="4" width="18" height="16" rx="2"/>
      <polyline points="6.5,9 9.5,12 6.5,15"/><line x1="11.5" y1="15" x2="17" y2="15"/>
    </symbol>
    <symbol id="glyph-clock" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"/><polyline points="12,7 12,12 16,14"/>
    </symbol>
    <symbol id="glyph-dice" viewBox="0 0 24 24">
      <rect x="4" y="4" width="16" height="16" rx="3"/>
      <circle cx="8.5" cy="8.5" r="1.2" fill="currentColor" stroke="none"/>
      <circle cx="15.5" cy="8.5" r="1.2" fill="currentColor" stroke="none"/>
      <circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/>
      <circle cx="8.5" cy="15.5" r="1.2" fill="currentColor" stroke="none"/>
      <circle cx="15.5" cy="15.5" r="1.2" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="glyph-percent" viewBox="0 0 24 24">
      <line x1="19" y1="5" x2="5" y2="19"/>
      <circle cx="7.5" cy="7.5" r="2.5"/><circle cx="16.5" cy="16.5" r="2.5"/>
    </symbol>
  </defs>
</svg>
<header class="top">
  <div class="brand">
    <svg class="glyph" width="28" height="28" viewBox="0 0 24 24" style="color:var(--gold)"><use href="#glyph-markov_brain"/></svg>
    <h1>GameBrains</h1>
  </div>
  <span class="tag">interactive research demo</span>
  <nav class="tabs">
    <a href="/" class="{{ 'active' if active_tab == 'match' else '' }}">Match</a>
    <a href="/evolve" class="{{ 'active' if active_tab == 'evolve' else '' }}">Evolutionary</a>
    <a href="/analytics" class="{{ 'active' if active_tab == 'analytics' else '' }}">Analytics</a>
    <a href="/spacemap" class="{{ 'active' if active_tab == 'spacemap' else '' }}">Space map</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
