<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GameBrains</title>
<style>
  :root {
    /* Felt table (page), rulebook-page cards, foil accent, five player-piece colors. */
    --felt: #1c3b2e; --felt-deep: #12261d; --felt-text: #e6e0c8;
    --panel: #f4ecd8; --panel-edge: #cdb87e; --ink: #241a10; --ink-soft: #6b5a41;
    --gold: #c99a3e; --gold-deep: #8a6a26;
    --piece-qlearning: #3d6b8a; --piece-dqn: #7a4a8a; --piece-fep: #6b8a3d;
    --piece-markov_brain: #b5541f; --piece-classic: #5c5346;
    --coop: #4f9a5c; --defect: #b5433a;
    --font-display: "Iowan Old Style", "Palatino Linotype", Georgia, "Times New Roman", serif;
    --font-body: "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif;
    --font-mono: "Cascadia Code", Consolas, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--felt);
    background-image: radial-gradient(circle at 15% -10%, #24493866 0%, transparent 55%);
    color: var(--felt-text); font-family: var(--font-body); line-height: 1.45;
  }
  header.top {
    background: var(--felt-deep); border-bottom: 3px solid var(--gold);
    padding: 18px 28px 0; display: flex; align-items: flex-end; gap: 18px; flex-wrap: wrap;
  }
  header.top .brand { display: flex; align-items: center; gap: 10px; padding-bottom: 14px; }
  header.top h1 {
    font-family: var(--font-display); font-size: 26px; margin: 0; color: var(--gold);
    letter-spacing: .01em;
  }
  header.top .tag {
    color: var(--felt-text); opacity: .65; font-size: 12px; padding-bottom: 16px;
    text-transform: uppercase; letter-spacing: .08em;
  }
  nav.tabs { margin-left: auto; display: flex; gap: 4px; }
  nav.tabs a {
    color: var(--felt-text); text-decoration: none; padding: 9px 18px; font-size: 13.5px;
    font-family: var(--font-display); border-radius: 8px 8px 0 0; background: #ffffff12;
    border: 1px solid #ffffff22; border-bottom: none; opacity: .75;
  }
  nav.tabs a:hover { opacity: 1; }
  nav.tabs a.active { background: var(--panel); color: var(--ink); opacity: 1; font-weight: 600; }
  main { max-width: 1080px; margin: 0 auto; padding: 26px 24px 70px; }
  .panel {
    background: var(--panel); color: var(--ink); border-radius: 10px;
    padding: 20px 24px; margin-bottom: 22px; box-shadow: 0 6px 18px #00000040;
    border-top: 4px solid var(--gold);
  }
  .panel h2 {
    margin: 0 0 14px; font-family: var(--font-display); font-size: 16px; font-weight: 700;
    color: var(--ink); display: flex; align-items: center; gap: 10px;
  }
  .panel h2 .step {
    display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px;
    border-radius: 50%; background: var(--gold); color: var(--felt-deep); font-size: 12px;
    font-family: var(--font-body); font-weight: 700;
  }
  .glyph { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.5;
    vertical-align: middle; flex-shrink: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
  label { display: block; font-size: 12.5px; color: var(--ink-soft); margin: 10px 0 4px; }
  label .hint { font-style: italic; }
  input[type=number], input[type=text], select {
    width: 100%; padding: 7px 9px; border-radius: 6px; border: 1px solid var(--panel-edge);
    background: #fffdf7; color: var(--ink); font-size: 14px; font-family: var(--font-body);
  }
  select:disabled, option:disabled { color: #a89b84; }
  fieldset { border: 1px solid var(--panel-edge); border-radius: 8px; padding: 12px 14px; margin-top: 14px; }
  legend { color: var(--ink-soft); font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; padding: 0 6px; }
  .checkrow { display: flex; align-items: center; gap: 8px; margin: 9px 0; }
  .checkrow input { width: auto; }
  .checkrow.disabled { opacity: .5; }
  button, .btn {
    background: var(--gold); color: var(--felt-deep); border: none; border-radius: 8px;
    padding: 11px 22px; font-size: 15px; font-weight: 700; font-family: var(--font-display);
    cursor: pointer; margin-top: 8px;
  }
  button:hover, .btn:hover { background: #dcae54; }
  button.secondary, .btn.secondary {
    background: #ffffff; color: var(--ink); border: 1px solid var(--panel-edge);
    font-weight: 600; font-size: 13px; padding: 7px 14px; font-family: var(--font-body);
  }
  table { border-collapse: collapse; width: 100%; font-size: 13px; font-family: var(--font-mono); }
  th, td { padding: 5px 9px; text-align: center; border: 1px solid var(--panel-edge); }
  th { color: var(--ink-soft); font-weight: 600; font-family: var(--font-body); }
  .qtable td.pick { color: var(--coop); font-weight: 700; text-align: left; border: none; font-family: var(--font-body); }
  .creature {
    border: 1px solid var(--panel-edge); border-radius: 8px; padding: 16px 18px; margin-bottom: 14px;
    background: #fffdf7; border-left: 6px solid var(--piece-color, var(--gold));
  }
  .creature h3 {
    margin: 0 0 10px; font-size: 15px; font-family: var(--font-display); font-weight: 700;
    display: flex; align-items: center; gap: 8px; color: var(--ink);
  }
  .creature .glyph { color: var(--piece-color, var(--ink)); width: 26px; height: 26px; }
  .creature .kindtag {
    display: inline-block; font-size: 10.5px; padding: 2px 8px; border-radius: 3px;
    background: var(--piece-color, var(--ink-soft)); color: #fff; text-transform: uppercase;
    letter-spacing: .03em; font-family: var(--font-body);
  }
  .meta { color: var(--ink-soft); font-size: 12px; margin: 6px 0 0; }
  .rule { font-size: 14px; }
  .beliefs .barrow { display: flex; align-items: center; gap: 8px; margin: 4px 0; font-size: 12px; }
  .beliefs .lab { width: 90px; color: var(--ink-soft); text-align: right; font-family: var(--font-mono); }
  .beliefs .bar { flex: 1; background: #e8ddc3; border-radius: 3px; height: 12px; overflow: hidden; }
  .beliefs .fill { display: block; height: 100%; background: var(--piece-fep); }
  .beliefs .val { width: 36px; color: var(--ink-soft); font-family: var(--font-mono); }
  .mbrain .bit {
    display: inline-flex; width: 24px; height: 24px; align-items: center; justify-content: center;
    margin: 0 3px 3px 0; border-radius: 4px; font-size: 12px; font-weight: 700; font-family: var(--font-mono);
  }
  .mbrain .bit.sensor { border: 2px solid var(--piece-qlearning); }
  .mbrain .bit.hidden { border: 2px solid var(--ink-soft); }
  .mbrain .bit.motor { border: 2px solid var(--piece-markov_brain); }
  .mbrain .bit.on { background: var(--piece-markov_brain); color: #fff; }
  .mbrain .bit.off { background: #e8ddc3; }
  .legend { font-style: italic; }
  .dqnnet { margin: 8px 0; }
  .netlayer { display: flex; align-items: center; gap: 4px; margin: 4px 0; flex-wrap: wrap; }
  .netlabel { width: 150px; color: var(--ink-soft); font-size: 11.5px; flex-shrink: 0; font-family: var(--font-body); }
  .neuron { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 1px solid #0003; }
  .moretag { color: var(--ink-soft); font-size: 11px; margin-left: 4px; }
  details.explain {
    margin-top: 10px; background: #eee3c8; border: 1px solid var(--panel-edge); border-radius: 6px;
    padding: 8px 12px; font-size: 13px;
  }
  details.explain summary { cursor: pointer; color: var(--gold-deep); font-weight: 600; font-size: 12.5px; }
  details.explain p { margin: 8px 0 0; }
  pre.console {
    background: var(--felt-deep); color: var(--felt-text); border-radius: 8px; padding: 12px 14px;
    max-height: 420px; overflow: auto; font-size: 12px; white-space: pre-wrap; font-family: var(--font-mono);
  }
  .coopchart { width: 100%; height: 140px; background: var(--felt-deep); border-radius: 8px; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 4px; font-size: 11.5px; font-weight: 600; }
  .badge.ok { background: var(--coop); color: #f4ecd8; }
  .badge.warn { background: var(--defect); color: #f4ecd8; }
  .badge.todo { background: #ded1ad; color: var(--ink-soft); border: 1px dashed var(--panel-edge); }
  code { background: #e8ddc3; padding: 1px 5px; border-radius: 3px; font-size: 12px; font-family: var(--font-mono); }
  a { color: var(--gold-deep); }
  .backlink { display: inline-block; margin-bottom: 16px; color: var(--felt-text); }
  .rosterrow {
    display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; padding: 12px;
    border: 1px solid var(--panel-edge); border-radius: 8px; margin-bottom: 8px; background: #fffdf7;
  }
  .rosterrow .kindpick { min-width: 190px; display: flex; align-items: flex-end; gap: 8px; }
  .rosterrow .kindpick .glyph { color: var(--ink-soft); margin-bottom: 8px; }
  .rosterrow .kindpick select { flex: 1; }
  .rosterrow .countpick { width: 80px; }
  .rosterrow .kindfield { min-width: 140px; }
  .rosterrow .removerow { align-self: center; }
  .epsilon-hint { font-size: 11px; color: var(--ink-soft); display: block; margin-top: 2px; }
  #agent-total { color: var(--gold-deep); font-weight: 700; }
  .quickadd { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="glyph-qlearning" viewBox="0 0 24 24">
      <rect x="3" y="3" width="18" height="18" rx="1.5"/>
      <line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/>
      <line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/>
    </symbol>
    <symbol id="glyph-dqn" viewBox="0 0 24 24">
      <circle cx="5" cy="6" r="2"/><circle cx="5" cy="12" r="2"/><circle cx="5" cy="18" r="2"/>
      <circle cx="19" cy="12" r="2"/>
      <line x1="7" y1="6" x2="17" y2="11.3"/><line x1="7" y1="12" x2="17" y2="12"/>
      <line x1="7" y1="18" x2="17" y2="12.7"/>
    </symbol>
    <symbol id="glyph-fep" viewBox="0 0 24 24">
      <path d="M2 12 C6 5, 18 5, 22 12 C18 19, 6 19, 2 12 Z"/><circle cx="12" cy="12" r="3.2"/>
    </symbol>
    <symbol id="glyph-markov_brain" viewBox="0 0 24 24">
      <path d="M12 2 L20 7 V17 L12 22 L4 17 V7 Z"/>
      <circle cx="12" cy="12" r="2"/><circle cx="12" cy="6" r="1.3"/><circle cx="17.5" cy="9.5" r="1.3"/>
      <circle cx="17.5" cy="14.5" r="1.3"/><circle cx="12" cy="18" r="1.3"/><circle cx="6.5" cy="14.5" r="1.3"/>
      <circle cx="6.5" cy="9.5" r="1.3"/>
    </symbol>
    <symbol id="glyph-classic" viewBox="0 0 24 24">
      <rect x="4" y="3" width="16" height="18" rx="1"/>
      <line x1="7" y1="8" x2="17" y2="8"/><line x1="7" y1="12" x2="17" y2="12"/><line x1="7" y1="16" x2="14" y2="16"/>
    </symbol>
  </defs>
</svg>
<header class="top">
  <div class="brand">
    <svg class="glyph" width="28" height="28" viewBox="0 0 24 24" style="color:var(--gold)"><use href="#glyph-markov_brain"/></svg>
    <h1>GameBrains</h1>
  </div>
  <span class="tag">interactive research demo</span>
  <nav class="tabs">
    <a href="/" class="{{ 'active' if active_tab == 'match' else '' }}">Match</a>
    <a href="/evolve" class="{{ 'active' if active_tab == 'evolve' else '' }}">Evolutionary</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
